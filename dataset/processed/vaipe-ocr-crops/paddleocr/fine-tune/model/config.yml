Global:
  model_name: vaipe_ppocrv5_mobile_rec
  debug: false
  use_gpu: true
  epoch_num: 5
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: D:/HocTap/Projects/NCKH-Medicare/dataset/processed/vaipe-ocr-crops/paddleocr/fine-tune/model
  save_epoch_step: 1
  eval_batch_step:
  - 0
  - 500
  cal_metric_during_train: true
  pretrained_model: D:/HocTap/Projects/NCKH-Medicare/dataset/processed/vaipe-ocr-crops/paddleocr/fine-tune/PP-OCRv5_mobile_rec_pretrained.pdparams
  checkpoints: null
  use_visualdl: false
  character_dict_path: D:/HocTap/Projects/NCKH-Medicare/dataset/processed/vaipe-ocr-crops/paddleocr/fine-tune/vaipe_vietnamese_dict.txt
  infer_mode: false
  use_space_char: true
  distributed: false
  d2s_train_image_shape:
  - 3
  - 48
  - 320
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 5.0e-05
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 25
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: SimpleDataSet
    data_dir: D:/HocTap/Projects/NCKH-Medicare/dataset/processed/vaipe-ocr-crops
    label_file_list:
    - D:/HocTap/Projects/NCKH-Medicare/dataset/processed/vaipe-ocr-crops/paddleocr/rec_gt_train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        max_text_length: 25
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 8
    drop_last: false
    num_workers: 0
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: D:/HocTap/Projects/NCKH-Medicare/dataset/processed/vaipe-ocr-crops
    label_file_list:
    - D:/HocTap/Projects/NCKH-Medicare/dataset/processed/vaipe-ocr-crops/paddleocr/rec_gt_validation.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        max_text_length: 25
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 8
    num_workers: 2
profiler_options: null
